services:
  watcher:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "${WEBHOOK_PORT:-8080}:8080"
    volumes:
      - ./state.json:/app/state.json
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
