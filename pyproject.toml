[project]
name = "tailscale-device-watch"
version = "0.1.0"
description = "Alert when a Tailscale device comes back online (Discord, email, SMS)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27.0",
  "python-dotenv>=1.0.0",
  "fastapi>=0.115.0",
  "uvicorn>=0.32.0",
]

[project.scripts]
tailscale-device-watch = "tailscale_device_watch.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["tailscale_device_watch*"]
